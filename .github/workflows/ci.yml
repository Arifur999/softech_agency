name: CI

# Quality gate.
#
# No `push` trigger on purpose. deploy.yml already calls this workflow on every
# push to main, and when both fired for the same commit they landed in the same
# concurrency group and cancelled each other — runs died after ~30s having
# tested nothing. Pull requests run it directly; main runs it through deploy.
on:
  pull_request:
  workflow_call:

concurrency:
  # github.workflow is the CALLER's name when reused, so a PR run and a
  # deploy-triggered run can never share a group.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

      # tsconfig pulls in .next/types, where Next generates the globals the app
      # router relies on (LayoutProps, PageProps, route literals). Those only
      # exist after a dev server or build has run, so on a clean checkout tsc
      # fails on names it cannot see. typegen writes them without the full build.
      - name: Generate route types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
