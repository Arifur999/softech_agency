# Stage 1 of attaching softech.agency — appended to the existing nginx.conf.
#
# Only reason this exists: the `listen 80 default_server` block returns 444, so
# an ACME challenge for softech.agency is closed before certbot can answer it.
# This block claims the two names on port 80 so the webroot challenge resolves,
# and nothing else. No 443, because no certificate exists yet and nginx refuses
# to start when ssl_certificate points at a missing file — which would take
# furnify down with it.
#
# Replaced by softech.agency.container.conf once the certificate is issued.

server {
    listen 80;
    server_name softech.agency www.softech.agency;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
