# /etc/nginx/sites-available/softech.agency
#
# Adds softech.agency and www.softech.agency only. There is no default_server
# here, so an unmatched host still falls through to whatever already handles
# it — furnify.softech.agency keeps its own server block untouched.
#
# APP_PORT must match APP_PORT in /opt/softech-agency/.env (default 3100).

upstream softech_agency_app {
    server 127.0.0.1:3100;
    keepalive 32;
}

# ---- HTTP: ACME challenges, everything else redirected -------------------
server {
    listen 80;
    listen [::]:80;
    server_name softech.agency www.softech.agency;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://softech.agency$request_uri;
    }
}

# ---- HTTPS: www -> apex --------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.softech.agency;

    ssl_certificate     /etc/letsencrypt/live/softech.agency/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/softech.agency/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://softech.agency$request_uri;
}

# ---- HTTPS: the site -----------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name softech.agency;

    ssl_certificate     /etc/letsencrypt/live/softech.agency/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/softech.agency/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/softech.agency.access.log;
    error_log  /var/log/nginx/softech.agency.error.log;

    # The hero photography and dashboard renders are the heavy assets here.
    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # Immutable build output — safe to cache hard at the edge and in browsers.
    location /_next/static/ {
        proxy_pass http://softech_agency_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Optimised images: let Next set the policy, just keep them off the log.
    location /_next/image {
        proxy_pass http://softech_agency_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        proxy_pass http://softech_agency_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        proxy_buffering on;
        proxy_cache_bypass $http_upgrade;
    }
}
