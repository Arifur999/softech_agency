# softech.agency — appended to /srv/hatim/hatim_Backend/nginx.conf.
#
# Sits alongside the furnify blocks in the same nginx container. Nothing above
# this line is read or modified; furnify's server blocks match on their own
# server_name and are unaffected.
#
# The site itself is a Next.js container named `softech-agency`, joined to the
# hatim_backend_default network. It publishes no host port — nginx reaches it
# over the compose network and it is unreachable from the internet directly.

server {
    listen 80;
    server_name softech.agency www.softech.agency;

    # Above the redirect, or renewals start failing silently in 90 days.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://softech.agency$request_uri;
    }
}

# www -> apex, so the site has one canonical origin.
server {
    listen 443 ssl;
    http2 on;
    server_name www.softech.agency;

    ssl_certificate     /etc/letsencrypt/live/softech.agency/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/softech.agency/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    return 301 https://softech.agency$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name softech.agency;

    ssl_certificate     /etc/letsencrypt/live/softech.agency/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/softech.agency/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    # --- Security headers ---------------------------------------------------
    # Same note as the furnify blocks: nginx discards inherited add_header
    # directives inside any location that declares its own, so a location that
    # sets Cache-Control has to repeat all of these.
    #
    # The CSP is weaker than furnify's in one place: script-src needs
    # 'unsafe-inline' because Next.js injects an inline bootstrap script and
    # inline JSON on every page. Tightening it means wiring a per-request nonce
    # through middleware, which a static marketing site does not justify. The
    # rest is locked down, and there is no user input or API here to inject
    # through. Fonts are self-hosted by next/font at build time, so no
    # fonts.googleapis.com or fonts.gstatic.com is needed.
    add_header Strict-Transport-Security "max-age=15768000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Docker's embedded DNS. Needed because the upstream host below is held in
    # a variable — see the note in the location block.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Build output is content-hashed, so it can be cached hard and permanently.
    location /_next/static/ {
        set $softech_host softech-agency;
        proxy_pass http://$softech_host:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=15768000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        access_log off;
    }

    # Next's optimiser already sets a long Cache-Control on these; just keep
    # them out of the access log.
    location /_next/image {
        set $softech_host softech-agency;
        proxy_pass http://$softech_host:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        # The upstream host is a variable on purpose. With a literal hostname,
        # nginx resolves it while LOADING the config: if the softech-agency
        # container is not running, `nginx -t` fails and — worse — a restart of
        # this container fails outright, taking furnify down with it. Through a
        # variable, resolution happens per request instead, so a stopped site
        # is a 502 on this hostname only and nginx always starts.
        set $softech_host softech-agency;
        proxy_pass http://$softech_host:3000;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}
